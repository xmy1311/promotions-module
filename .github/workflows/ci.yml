name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Etapas dependientes: lint -> test -> build -> smoke.
# Cada job declara `needs`, así que un fallo temprano detiene la cadena.
env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: ESLint (backend)
        run: npm run lint --prefix backend

      - name: ESLint (frontend)
        run: npm run lint --prefix frontend

      - name: Verificación de tipos (backend)
        run: npm run typecheck --prefix backend

      - name: Verificación de tipos (frontend)
        run: npm run typecheck --prefix frontend

  test:
    name: Pruebas unitarias
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Pruebas del backend
        run: npm test --prefix backend

      - name: Pruebas del frontend
        run: npm test --prefix frontend

  build:
    name: Construcción de imágenes Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: promotions-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: promotions-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke:
    name: Smoke test de integración
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El secreto nunca vive en el repositorio: se inyecta aquí y solo aquí.
      # Si no está configurado, el paso siguiente aborta el pipeline con un
      # mensaje que dice exactamente qué falta.
      - name: Preparar variables de entorno
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          {
            echo "MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}"
            echo "DB_NAME=promotions"
            echo "DB_USER=sa"
            echo "APP_TIMEZONE=America/Bogota"
            echo "CORS_ORIGINS="
            echo "LOG_LEVEL=info"
            echo "FRONTEND_PORT=5173"
            echo "BACKEND_PORT=3000"
            echo "DB_PORT_HOST=1433"
          } >> .env

      - name: Verificar variables requeridas
        run: |
          set -a && . ./.env && set +a
          ./scripts/check-required-env.sh

      - name: Levantar la aplicación
        run: docker compose up -d --build

      - name: Esperar a que /health responda 200
        run: ./scripts/wait-for-health.sh http://localhost:3000/health 240

      - name: Smoke test de la API y la base de datos
        run: ./scripts/smoke-test.sh http://localhost:3000

      - name: Verificar que el frontend se sirve
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:5173)"
          echo "Frontend respondió ${status}"
          test "$status" = "200"

      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Apagar la aplicación
        if: always()
        run: docker compose down -v
